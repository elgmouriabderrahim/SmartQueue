openapi: 3.0.3
info:
  title: SmartQueue API
  version: 1.0.0
  description: Smart Appointment & Queue Management System API (Morocco).
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
security:
  - bearerAuth: []
paths:
  /home:
    get:
      security: []
      summary: API home
      responses:
        '200':
          description: Success

  /auth/register:
    post:
      security: []
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Citizen One
              email: citizen@example.com
              password: password123
              password_confirmation: password123
              role: citizen
      responses:
        '201':
          description: Registered

  /auth/login:
    post:
      security: []
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: admin@example.com
              password: password123
      responses:
        '200':
          description: Logged in

  /auth/logout:
    post:
      summary: Logout current user
      responses:
        '200':
          description: Logged out

  /dashboard:
    get:
      summary: Admin dashboard metrics
      responses:
        '200':
          description: Dashboard metrics
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

  /institutions:
    get:
      security: []
      summary: List institutions
      responses:
        '200':
          description: Institutions list
    post:
      summary: Create institution (admin)
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Rabat Municipality
              slug: rabat-municipality
              city: Rabat
              region: Rabat-Sale-Kenitra
              status: active
      responses:
        '201':
          description: Institution created

  /services:
    get:
      security: []
      summary: List services
      responses:
        '200':
          description: Services list
    post:
      summary: Create service (admin/institution)
      requestBody:
        required: true
        content:
          application/json:
            example:
              institution_id: 1
              name: Passport Renewal
              duration: 20
              capacity: 80
              working_hours:
                start: '08:30'
                end: '16:30'
      responses:
        '201':
          description: Service created

  /appointments:
    get:
      summary: List appointments
      responses:
        '200':
          description: Appointments list
    post:
      summary: Create appointment
      requestBody:
        required: true
        content:
          application/json:
            example:
              user_id: 1
              service_id: 1
              appointment_date: '2026-05-10 09:00:00'
      responses:
        '201':
          description: Appointment created
        '422':
          description: Validation / business rule violation

  /appointments/{appointment}:
    put:
      summary: Update appointment
      parameters:
        - in: path
          name: appointment
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
    delete:
      summary: Cancel appointment
      parameters:
        - in: path
          name: appointment
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cancelled

  /appointments/{appointment}/complete:
    patch:
      summary: Complete appointment (admin/institution)
      parameters:
        - in: path
          name: appointment
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Completed

  /queues:
    get:
      summary: List queues
      responses:
        '200':
          description: Queues list
    post:
      summary: Create queue
      requestBody:
        required: true
        content:
          application/json:
            example:
              service_id: 1
              date: '2026-05-10'
      responses:
        '201':
          description: Queue created

  /conversations:
    get:
      summary: List conversations for auth user
      responses:
        '200':
          description: Conversations list
    post:
      summary: Start conversation
      requestBody:
        required: true
        content:
          application/json:
            example:
              citizen_id: 1
              institution_user_id: 2
              subject: Appointment issue
      responses:
        '201':
          description: Conversation started

  /messages:
    post:
      summary: Send message in conversation
      requestBody:
        required: true
        content:
          application/json:
            example:
              conversation_id: 1
              sender_id: 1
              recipient_id: 2
              body: Hello, I need support
      responses:
        '201':
          description: Message sent

  /conversations/read:
    post:
      summary: Mark conversation messages as read
      requestBody:
        required: true
        content:
          application/json:
            example:
              conversation_id: 1
              recipient_id: 2
      responses:
        '200':
          description: Read status updated

  /notifications:
    get:
      summary: List notifications for auth user
      responses:
        '200':
          description: Notifications list

  /notifications/{notificationId}/read:
    patch:
      summary: Mark notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read

  /ratings:
    post:
      summary: Create rating (1-5) with comment
      requestBody:
        required: true
        content:
          application/json:
            example:
              user_id: 1
              appointment_id: 1
              service_id: 1
              overall_rating: 5
              comment: Fast and professional service
      responses:
        '201':
          description: Rating created

  /analytics:
    get:
      summary: Get analytics metrics
      parameters:
        - in: query
          name: service_id
          schema:
            type: integer
      responses:
        '200':
          description: Metrics

  /analytics/sync:
    post:
      summary: Sync peak usage analytics for a date (admin)
      requestBody:
        required: true
        content:
          application/json:
            example:
              date: '2026-05-10'
      responses:
        '200':
          description: Synced
